name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/templates
          mv /root/.local/share/godot/templates/4.2.stable ~/.local/share/godot/templates/4.2.stable
      - name: Android Build
        run: |
          mkdir -v -p build
          godot -v --headless --export-debug "Android" build/dafeiyu.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dafeiyu-APK
          path: build/dafeiyu.apk
