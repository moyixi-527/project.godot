name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          cp -R /root/.local/share/godot/export_templates/4.2.stable ~/.local/share/godot/export_templates/

      - name: Setup Keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Import Project
        run: |
          godot --headless --editor --quit

      - name: Android Build
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot -v --headless --export-debug "Android" build/dafeiyu.apk
          ls -la build/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dafeiyu-APK
          path: build/dafeiyu.apk
          if-no-files-found: error
